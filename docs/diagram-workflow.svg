<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/>
    </marker>
    <marker id="arT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4fd1c5"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#12141a"/>

  <text x="56" y="52" fill="#e8eaed" font-size="27" font-weight="700">An agent loop, with and without Headroom</text>
  <text x="56" y="78" fill="#9aa3b2" font-size="14">Same agent, same 105-turn debugging session, same model. Only the middle changes.</text>

  <!-- ============ PANEL A ============ -->
  <rect x="56" y="104" width="528" height="664" rx="10" fill="#171a21" stroke="#262a33"/>
  <text x="80" y="136" fill="#f56565" font-size="12" font-weight="700" letter-spacing="1.6">WITHOUT HEADROOM</text>

  <rect x="170" y="158" width="300" height="60" rx="8" fill="#1c1f27" stroke="#343a45"/>
  <text x="320" y="182" fill="#e8eaed" font-size="14" font-weight="600" text-anchor="middle">AGENT LOOP</text>
  <text x="320" y="202" fill="#9aa3b2" font-size="11" text-anchor="middle">reads files · runs tools · replies · repeats</text>

  <line x1="320" y1="218" x2="320" y2="256" stroke="#9aa3b2" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="332" y="242" fill="#9aa3b2" font-size="11">sends the entire history, every turn</text>

  <text x="170" y="286" fill="#9aa3b2" font-size="11" letter-spacing="0.8">CONTEXT WINDOW</text>
  <rect x="170" y="294" width="300" height="34" rx="5" fill="#1c1f27" stroke="#2f343d"/>
  <rect x="172" y="296" width="296" height="30" rx="4" fill="#4a5568"/>
  <text x="320" y="316" fill="#e8eaed" font-size="11" font-weight="600" text-anchor="middle">100% FULL</text>

  <text x="320" y="366" fill="#f56565" font-size="15" font-weight="700" text-anchor="middle">COMPACTION FIRES</text>
  <line x1="320" y1="376" x2="320" y2="404" stroke="#f56565" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="320" y="392" fill="#9aa3b2" font-size="10" text-anchor="middle"></text>

  <g fill="#2b3038">
    <rect x="170" y="412" width="9" height="26" rx="2" opacity="0.5"/><rect x="184" y="412" width="9" height="26" rx="2" opacity="0.42"/>
    <rect x="198" y="412" width="9" height="26" rx="2" opacity="0.34"/><rect x="212" y="412" width="9" height="26" rx="2" opacity="0.28"/>
    <rect x="226" y="412" width="9" height="26" rx="2" opacity="0.22"/><rect x="240" y="412" width="9" height="26" rx="2" opacity="0.16"/>
    <rect x="254" y="412" width="9" height="26" rx="2" opacity="0.12"/><rect x="268" y="412" width="9" height="26" rx="2" opacity="0.08"/>
  </g>
  <g fill="#4a5568">
    <rect x="296" y="412" width="9" height="26" rx="2"/><rect x="310" y="412" width="9" height="26" rx="2"/>
    <rect x="324" y="412" width="9" height="26" rx="2"/><rect x="338" y="412" width="9" height="26" rx="2"/>
    <rect x="352" y="412" width="9" height="26" rx="2"/><rect x="366" y="412" width="9" height="26" rx="2"/>
    <rect x="380" y="412" width="9" height="26" rx="2"/><rect x="394" y="412" width="9" height="26" rx="2"/>
    <rect x="408" y="412" width="9" height="26" rx="2"/><rect x="422" y="412" width="9" height="26" rx="2"/>
    <rect x="436" y="412" width="9" height="26" rx="2"/><rect x="450" y="412" width="9" height="26" rx="2"/>
  </g>
  <text x="170" y="458" fill="#f56565" font-size="10">turns 1–40 → lossy summary</text>
  <text x="352" y="458" fill="#9aa3b2" font-size="10">recent turns kept</text>

  <rect x="170" y="484" width="300" height="52" rx="6" fill="#1c1f27" stroke="#3a2b2f"/>
  <text x="186" y="506" fill="#e8eaed" font-size="12" font-weight="600">Everything is compressed at once,</text>
  <text x="186" y="524" fill="#e8eaed" font-size="12" font-weight="600">or nothing is. There is no in between.</text>

  <line x1="320" y1="548" x2="320" y2="586" stroke="#9aa3b2" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="170" y="590" width="300" height="52" rx="8" fill="#1c1f27" stroke="#343a45"/>
  <text x="320" y="612" fill="#e8eaed" font-size="14" font-weight="600" text-anchor="middle">MODEL</text>
  <text x="320" y="630" fill="#9aa3b2" font-size="11" text-anchor="middle">fixed window · 32k</text>

  <rect x="80" y="678" width="480" height="66" rx="8" fill="#1e1518" stroke="#4a2b30"/>
  <text x="104" y="706" fill="#f56565" font-size="15" font-weight="700">Your turn-3 constraint: GONE</text>
  <text x="104" y="728" fill="#9aa3b2" font-size="12">0 of 5 planted facts survive — at turn 25, 50 and 100</text>

  <!-- ============ PANEL B ============ -->
  <rect x="616" y="104" width="528" height="664" rx="10" fill="#171a21" stroke="#2b3d3f"/>
  <text x="640" y="136" fill="#4fd1c5" font-size="12" font-weight="700" letter-spacing="1.6">WITH HEADROOM</text>

  <rect x="730" y="158" width="300" height="60" rx="8" fill="#1c1f27" stroke="#343a45"/>
  <text x="880" y="182" fill="#e8eaed" font-size="14" font-weight="600" text-anchor="middle">AGENT LOOP</text>
  <text x="880" y="202" fill="#9aa3b2" font-size="11" text-anchor="middle">unchanged — same code, same requests</text>

  <line x1="880" y1="218" x2="880" y2="256" stroke="#4fd1c5" stroke-width="1.5" marker-end="url(#arT)"/>
  <text x="892" y="242" fill="#4fd1c5" font-size="11">one BASE_URL change</text>

  <rect x="730" y="266" width="300" height="272" rx="10" fill="#141b1c" stroke="#4fd1c5" stroke-width="1.5"/>
  <text x="748" y="292" fill="#4fd1c5" font-size="14" font-weight="700">HEADROOM PROXY</text>
  <text x="748" y="310" fill="#9aa3b2" font-size="10.5">sorts every message, then compresses bottom-up</text>
  <text x="748" y="326" fill="#9aa3b2" font-size="10.5">— and only once the window is actually filling</text>

  <text x="748" y="352" fill="#6b7484" font-size="9.5" letter-spacing="1">WHAT IT KEEPS WHOLE</text>
  <g font-size="11">
    <text x="748" y="374" fill="#f6ad55">system prompt</text>
    <rect x="936" y="365" width="76" height="9" rx="2" fill="#f6ad55"/>
    <text x="748" y="396" fill="#f6ad55">your constraints</text>
    <rect x="936" y="387" width="76" height="9" rx="2" fill="#f6ad55"/>
    <text x="748" y="418" fill="#f6ad55">the last two turns</text>
    <rect x="936" y="409" width="76" height="9" rx="2" fill="#f6ad55"/>
  </g>
  <text x="1018" y="396" fill="#f6ad55" font-size="9.5" font-weight="700" transform="rotate(90 1018 396)" text-anchor="middle">PINNED</text>

  <text x="748" y="446" fill="#6b7484" font-size="9.5" letter-spacing="1">WHAT IT SHRINKS FIRST</text>
  <g font-size="11">
    <text x="748" y="468" fill="#9aa3b2">older assistant turns</text>
    <rect x="936" y="459" width="76" height="9" rx="2" fill="#22303a"/>
    <rect x="936" y="459" width="45" height="9" rx="2" fill="#4fd1c5"/>
    <text x="748" y="490" fill="#9aa3b2">file reads · tool output</text>
    <rect x="936" y="481" width="76" height="9" rx="2" fill="#22303a"/>
    <rect x="936" y="481" width="19" height="9" rx="2" fill="#4fd1c5"/>
  </g>
  <text x="748" y="516" fill="#e8eaed" font-size="11" font-weight="600">Originals are never thrown away.</text>

  <line x1="880" y1="538" x2="880" y2="586" stroke="#4fd1c5" stroke-width="1.5" marker-end="url(#arT)"/>
  <text x="892" y="566" fill="#4fd1c5" font-size="11">smaller, cache-stable prefix</text>

  <rect x="730" y="590" width="300" height="52" rx="8" fill="#1c1f27" stroke="#343a45"/>
  <text x="880" y="612" fill="#e8eaed" font-size="14" font-weight="600" text-anchor="middle">MODEL</text>
  <text x="880" y="630" fill="#9aa3b2" font-size="11" text-anchor="middle">same fixed window · 32k · never overflows</text>

  <rect x="640" y="678" width="480" height="66" rx="8" fill="#14201f" stroke="#2b4d48"/>
  <text x="664" y="706" fill="#4fd1c5" font-size="15" font-weight="700">Your turn-3 constraint: STILL THERE</text>
  <text x="664" y="728" fill="#9aa3b2" font-size="12">5 of 5 planted facts survive — at turn 25, 50 and 100</text>
</svg>
